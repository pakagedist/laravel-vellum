name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        include:
          - laravel: '10'
            testbench: '8.*'
          - laravel: '11'
            testbench: '9.*'
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'
        exclude:
          # Laravel 10 is not tested with PHP 8.4 and later.
          - php: '8.4'
            laravel: '10'
          - php: '8.5'
            laravel: '10'
          # Laravel 11 is not tested with PHP 8.5.
          - php: '8.5'
            laravel: '11'
          # Laravel 12 is not tested with PHP 8.5.
          - php: '8.5'
            laravel: '12'

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, openssl, zip
          coverage: none

      - name: Cache the Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install the dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            --with="illuminate/console:^${{ matrix.laravel }}.0" \
            --with="illuminate/filesystem:^${{ matrix.laravel }}.0" \
            --with="illuminate/http:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="illuminate/view:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:${{ matrix.testbench }}"

      - name: Validate the composer manifest
        run: composer validate --strict

      - name: Check the code style
        run: vendor/bin/pint --test

      - name: Run the static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run the test suite
        run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10'
            testbench: '8.*'

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, openssl, zip
          coverage: none

      - name: Install the lowest dependencies
        run: |
          composer update --prefer-dist --prefer-lowest --no-interaction --no-progress \
            --with="illuminate/console:^${{ matrix.laravel }}.0" \
            --with="illuminate/filesystem:^${{ matrix.laravel }}.0" \
            --with="illuminate/http:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="illuminate/view:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:${{ matrix.testbench }}"

      - name: Run the test suite
        run: vendor/bin/phpunit
